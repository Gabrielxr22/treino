// Cada dia vira uma sessão; a "melhor série" é a carga mais alta e, nela, o maior número de reps.
function sessionsOf(hist){
  const m=new Map();
  (hist||[]).forEach(x=>{if(!m.has(x.date))m.set(x.date,[]);m.get(x.date).push(x);});
  return [...m.entries()].sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0).map(([date,sets])=>{
    const w=Math.max(...sets.map(x=>x.w)),r=Math.max(...sets.filter(x=>x.w===w).map(x=>x.r));
    return{date,sets,w,r};
  });
}

function suggestion(e,hist,date){
  if(e.bw)return null;
  const prev=sessionsOf(hist).filter(x=>x.date<date).pop(),top=topReps(e);
  if(!prev||!top)return null;
  const work=prev.sets.filter(x=>x.w===prev.w);
  if(work.length>=e.s&&work.every(x=>x.r>=top)){
    const nw=round1(prev.w+(e.inc||2.5));
    return{up:true,w:nw,top,date:prev.date};
  }
  return{up:false,w:prev.w,top,date:prev.date};
}

// ——— Peso diário e média móvel de 7 dias ———
// A pesagem de um dia é ruído (água, sal, intestino). A média de 7 dias é o sinal,
// e é ela que o plano alimentar usa como juiz do déficit.
const dayNum=iso=>Math.round(new Date(iso+"T00:00:00").getTime()/86400000);
const shiftISO=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return isoOf(d);};
const round1=n=>Math.round(n*10)/10;
function weightSorted(){return [...WEIGHT].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}
function avgWindow(endISO,days){
  const end=dayNum(endISO),start=end-(days-1);
  const vals=WEIGHT.filter(x=>{const d=dayNum(x.date);return d>=start&&d<=end;}).map(x=>x.kg);
  if(!vals.length)return null;
  return{avg:vals.reduce((a,b)=>a+b,0)/vals.length,n:vals.length};
}
function saveWeight(date,kg){
  WEIGHT=WEIGHT.filter(x=>x.date!==date);
  WEIGHT.push({date,kg});
  WEIGHT.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return write(K_WEIGHT,WEIGHT);
}
// Compara a média dos últimos 7 dias com a dos 7 anteriores: a diferença é kg/semana.
function trend(){
  const today=todayISO(),cur=avgWindow(today,7);
  if(!cur)return{state:"empty"};
  const prev=avgWindow(shiftISO(today,-7),7);
  if(!prev)return{state:"young",avg:cur.avg,n:cur.n};
  let weeks=0;
  for(let k=0;k<6;k++){
    const a=avgWindow(shiftISO(today,-7*k),7),b=avgWindow(shiftISO(today,-7*(k+1)),7);
    if(!a||!b)break;
    if(a.avg-b.avg>-0.25)weeks++;else break;
  }
  return{state:"ok",avg:cur.avg,n:cur.n,rate:cur.avg-prev.avg,weeks};
}
// Traduz a taxa na regra que já está escrita no plano alimentar do Gabriel:

function verdict(t){
  if(t.state==="empty")return{tone:"n",short:"sem registro",long:"Pese-se de manhã, em jejum, depois do banheiro. Em alguns dias a média aparece aqui."};
  if(t.state==="young")return{tone:"n",short:t.n+" dia"+(t.n>1?"s":"")+" registrado"+(t.n>1?"s":""),
    long:"A tendência só fica confiável com duas semanas de registro. Continue lançando todo dia."};
  const r=t.rate;
  if(r<=-0.7)return{tone:"b",short:"caindo rápido demais",
    long:"Mais de 0,7 kg por semana: nesse ritmo o corpo começa a cobrar em músculo. Some uns 150 kcal por dia."};
  if(r<=-0.25)return{tone:"g",short:"no alvo",
    long:"Perdendo entre 0,25 e 0,7 kg por semana. Está funcionando — não mexa em nada."};
  if(r>=0.15)return{tone:"b",short:"subindo",
    long:"A média subiu. Antes de mudar qualquer número, pese por 7 dias o óleo, a aveia e o whey — é por aí que as calorias voltam sem você perceber."};
  if(t.weeks>=2)return{tone:"b",short:"parado há "+t.weeks+" semanas",
    long:"Antes de cortar calorias, revise a adesão: pese óleo, aveia e whey por 7 dias seguidos. Se continuar parado com tudo pesado, aí sim reduza uns 150 kcal."};
  return{tone:"n",short:"praticamente parado",
    long:"Uma semana parada é normal: água, sal e intestino escondem a perda de gordura. Só vale agir depois de 2–3 semanas assim."};
}

const ISO_RE=/^\d{4}-\d{2}-\d{2}$/;
// Devolve {log,body,done} normalizado, ou uma string com o motivo da recusa.
// O restaurar antigo aceitava qualquer objeto e o jogava direto dentro de LOG,
// corrompendo a base. Aqui nada entra sem conferir a forma.
function parseBundle(text){
  let o;
  try{o=JSON.parse(String(text).trim());}catch(e){return "Isso não é um backup válido — o texto não está no formato JSON.";}
  if(!o||typeof o!=="object"||Array.isArray(o))return "Isso não é um backup válido.";
  let log=o.log,body=o.body,done=o.done,weight=o.weight;
  if(log===undefined&&body===undefined&&done===undefined&&weight===undefined){log=o;body=[];done=[];} // backup antigo, só o log
  log=log||{};body=body||[];done=done||[];weight=weight||[];   // backups v2 não têm peso diário
  if(typeof log!=="object"||Array.isArray(log))return "Backup inválido: a parte de treinos está corrompida.";
  if(!Array.isArray(body)||!Array.isArray(done))return "Backup inválido: a parte de exames ou de dias concluídos está corrompida.";
  if(!Array.isArray(weight))return "Backup inválido: a parte de pesagens está corrompida.";
  for(const k of Object.keys(log)){
    if(!Array.isArray(log[k]))return `Backup inválido: os registros de "${k}" não formam uma lista.`;
    for(const e of log[k]){
      if(!e||typeof e!=="object"||!ISO_RE.test(e.date||"")||typeof e.w!=="number"||typeof e.r!=="number")
        return `Backup inválido: há um registro malformado em "${k}".`;
    }
  }
  for(const e of body)if(!e||typeof e!=="object"||!ISO_RE.test(e.date||""))return "Backup inválido: há um exame sem data válida.";
  for(const e of done)if(!e||typeof e!=="object"||!ISO_RE.test(e.date||"")||typeof e.id!=="string")return "Backup inválido: há um dia concluído malformado.";
  for(const e of weight)if(!e||typeof e!=="object"||!ISO_RE.test(e.date||"")||typeof e.kg!=="number")return "Backup inválido: há uma pesagem malformada.";
  return {log,body,done,weight};
}
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
// Séries idênticas no mesmo dia são legítimas (3 × 70 kg × 10). Conta quantas vezes
// cada uma aparece de cada lado e fica com o maior número — nunca colapsa séries.
function mergeLog(a,b){
  const out={};
  Object.keys(a).forEach(k=>out[k]=a[k].slice());
  Object.keys(b).forEach(k=>{
    const cur=out[k]||[],have=new Map();
    cur.forEach(x=>{const s=x.date+"|"+x.w+"|"+x.r;have.set(s,(have.get(s)||0)+1);});
    b[k].forEach(x=>{const s=x.date+"|"+x.w+"|"+x.r,n=have.get(s)||0;if(n>0)have.set(s,n-1);else cur.push({...x});});
    out[k]=cur.sort(byDate);
  });
  return out;
}
function mergeBody(a,b){const m={};a.forEach(x=>m[x.date]=x);b.forEach(x=>m[x.date]=x);return Object.values(m).sort(byDate);}
function mergeDone(a,b){const m={};[...a,...b].forEach(x=>m[x.date+"|"+x.id]=x);return Object.values(m).sort(byDate);}
function mergeWeight(a,b){const m={};a.forEach(x=>m[x.date]=x);b.forEach(x=>m[x.date]=x);return Object.values(m).sort(byDate);}

function exCard(e,i){
  const k=slug(e.n),hist=LOG[k]||[],day=hist.map((x,idx)=>({x,idx})).filter(o=>o.x.date===logDate),n=day.length;
  const past=sessionsOf(hist).filter(x=>x.date<logDate),prev=past[past.length-1];
  const sug=suggestion(e,hist,logDate),st=stalled(hist,e),open=openEx===i,complete=n>=e.s;
  const tags=(e.prio?'<span class="pill ac">Prioritário</span>':"")+(st?'<span class="pill warn">Estagnou</span>':"")
    +(!open&&!n&&sug&&sug.up?'<span class="pill good">Subir carga</span>':"");
  const sub=[`${e.s} × ${e.r}`];
  if(open){if(e.note)sub.push(e.note);}else sub.push(prev?"últ. "+prevLabel(e,prev):"novo");
  const cnt=`<span class="exCnt${complete?" ok":""}">${complete?ic("check",14,3):""}${n}/${e.s}</span>`;
  let body="";

    const unit=e.t?"s":"reps";
    const sugH=sug&&!complete?(sug.up
      ?`<div class="sug up">${ic("up",16,2.6)}<span><b>Suba para ${fmtN(sug.w)} kg.</b> Você bateu ${sug.top} ${unit} em todas as séries em ${fmtDate(sug.date)}.</span></div>`
      :`<div class="sug">${ic("right",16,2.4)}<span><b>Mantenha ${fmtN(sug.w)} kg</b> e busque ${sug.top} ${unit} em todas as ${e.s} séries.</span></div>`):"";
    const total=Math.max(e.s+(addRows[k]||0),n),bw=e.bw?" bw":"";
    const lastW=n?day[n-1].x.w:(sug?sug.w:(prev?prev.w:null)),wv=lastW!=null?fmtN(lastW):"";
    let rows=`<div class="srow shead${bw}"><span>SÉRIE</span><span>ANTERIOR</span>${e.bw?"":"<span>KG</span>"}<span>${e.t?"SEG":"REPS"}</span><span></span></div>`;
    let first=true;
    for(let r=0;r<total;r++){
      const ps=prev&&prev.sets[r],ant=ps?prevLabel(e,ps):"—",lbl=e.t?"Segundos":"Repetições";
      if(r<n){
        const o=day[r];
        rows+=`<div class="srow done${bw}"><span class="sn">${r+1}</span><span class="sp">${ant}</span>
          ${e.bw?"":`<input class="sin" inputmode="decimal" data-ew="${o.idx}" value="${fmtN(o.x.w)}" aria-label="Carga da série ${r+1} em kg">`}
          <input class="sin" inputmode="numeric" data-er="${o.idx}" value="${o.x.r}" aria-label="${lbl} da série ${r+1}">
          <button class="sck" data-un="${o.idx}" aria-label="Desfazer série ${r+1}">${ic("check",18,3)}</button></div>`;
      }else{
        const rp=ps?ps.r:(e.t?45:(topReps(e)||""));
        rows+=`<div class="srow${first?" act":""}${bw}"><span class="sn"${first?"":' style="color:var(--tx3)"'}>${r+1}</span><span class="sp">${ant}</span>
          ${e.bw?"":`<input class="sin" inputmode="decimal" id="w${i}_${r}"${first&&wv?` value="${wv}"`:""} placeholder="${wv}" aria-label="Carga da série ${r+1} em kg">`}
          <input class="sin" inputmode="numeric" id="r${i}_${r}" placeholder="${rp}" aria-label="${lbl} da série ${r+1}" enterkeyhint="done">
          <button class="sck" data-do="${r}" aria-label="Concluir série ${r+1}">${ic("check",18,3)}</button></div>`;
        first=false;
      }
    }
    body=`<div class="exBody">${sugH}<div class="sets">${rows}</div><p class="err" id="err${i}" hidden></p>
      <button class="addSet" data-add="1">${ic("plus",16,2.4)}Adicionar série</button></div>`;
  }
  return `<section class="card ex${open?" open":""}${complete?" done":""}" data-i="${i}">
    <button class="exHead" data-toggle="${i}" aria-expanded="${open}"><span class="grow"><span class="exTop"><span class="exn">${esc(e.n)}</span>${tags}</span>
      <span class="exs">${esc(sub.join(" · "))}</span></span>${cnt}<span class="chev" style="transform:rotate(${open?90:0}deg)">${ic("right",18)}</span></button>${body}</section>`;
}
function bindEx(w){
  const rr=()=>workout(w.id);
  app.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{const i=+b.dataset.toggle;openEx=openEx===i?null:i;rr();});
  if(scrollEx&&openEx!==null){const el=app.querySelector(`[data-i="${openEx}"]`);if(el)setTimeout(()=>el.scrollIntoView({block:"start",behavior:"smooth"}),40);}
  scrollEx=false;
  if(openEx===null)return;
  const i=openEx,e=w.ex[i],k=slug(e.n),err=app.querySelector("#err"+i);
  const showErr=m=>{err.hidden=false;err.textContent=m;};
  // Campo vazio usa o valor sugerido (placeholder): um toque no ✓ repete a carga e as reps da última vez.
  const val=el=>el?(el.value.trim()!==""?el.value:el.placeholder):"";
  app.querySelectorAll("[data-do]").forEach(b=>b.onclick=()=>{
    const r=+b.dataset.do;let wv=0;
    if(!e.bw){const c=checkNum(val(app.querySelector(`#w${i}_${r}`)),"carga");if(!c.ok)return showErr(c.msg);wv=c.val;}
    const cr=checkNum(val(app.querySelector(`#r${i}_${r}`)),e.t?"seg":"reps");if(!cr.ok)return showErr(cr.msg);
    const arr=(LOG[k]||[]).slice();arr.push({date:logDate,w:wv,r:cr.val});arr.sort(byDate);LOG[k]=arr;
    if(!write(K_LOG,LOG)){toast("Não salvou — exporte um backup",1);return rr();}
    const n=setsOn(arr,logDate).length;let msg=`Série ${n} registrada`,more=true;
    if(n>=e.s+(addRows[k]||0)){
      const pend=j=>setsOn(LOG[slug(w.ex[j].n)],logDate).length<w.ex[j].s;
      let nx=w.ex.findIndex((_,j)=>j>i&&pend(j));if(nx<0)nx=w.ex.findIndex((_,j)=>pend(j));
      if(nx>=0){openEx=nx;scrollEx=true;msg=`${e.n} completo`;}
      else{openEx=null;more=false;msg="Tudo feito — toque em Concluir";}
    }
    if(more&&logDate===todayISO())startRest(restFor(e),e.n);else if(!more)stopRest();
    toast(msg);rr();
  });
  app.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{
    const arr=(LOG[k]||[]).slice();arr.splice(+b.dataset.un,1);
    if(arr.length)LOG[k]=arr;else delete LOG[k];
    const ok=write(K_LOG,LOG);toast(ok?"Série desfeita":"Não salvou — exporte um backup",!ok);rr();
  });
  const upd=(el,f)=>{
    const idx=+(f==="w"?el.dataset.ew:el.dataset.er),arr=(LOG[k]||[]).slice();if(!arr[idx])return;
    const c=checkNum(el.value,f==="w"?"carga":(e.t?"seg":"reps"));if(!c.ok){showErr(c.msg);return;}
    if(arr[idx][f]===c.val)return;
    arr[idx]={...arr[idx],[f]:c.val};LOG[k]=arr;
    const ok=write(K_LOG,LOG);toast(ok?"Série corrigida":"Não salvou — exporte um backup",!ok);rr();
  };
  app.querySelectorAll("[data-ew]").forEach(el=>el.onchange=()=>upd(el,"w"));
  app.querySelectorAll("[data-er]").forEach(el=>el.onchange=()=>upd(el,"r"));
  app.querySelectorAll(`[id^="r${i}_"]`).forEach(inp=>inp.onkeydown=ev=>{
    if(ev.key==="Enter"){ev.preventDefault();const b=app.querySelector(`[data-do="${inp.id.split("_")[1]}"]`);if(b)b.click();}
  });
  app.querySelectorAll("input.sin").forEach(inp=>inp.addEventListener("input",()=>{err.hidden=true;}));
  const add=app.querySelector("[data-add]");if(add)add.onclick=()=>{addRows[k]=(addRows[k]||0)+1;rr();};
}

// ——— Timer de descanso ———
// Conta pelo relógio, não por ticks: se a tela bloquear, o tempo continua certo.
function startRest(sec,label){
  const old=document.getElementById("restBar");if(old)old.remove();
  REST={end:Date.now()+sec*1000,total:sec,label:label||""};drawRest();
  if(!restTick)restTick=setInterval(drawRest,250);
}
function stopRest(){
  REST=null;if(restTick){clearInterval(restTick);restTick=null;}
  const b=document.getElementById("restBar");if(b)b.remove();
  document.body.classList.remove("resting");
}
function drawRest(){
  if(!REST)return stopRest();
  const left=Math.max(0,Math.ceil((REST.end-Date.now())/1000)),C=138.2;
  let b=document.getElementById("restBar");
  if(!b){
    b=document.createElement("div");b.id="restBar";b.className="restBar";b.setAttribute("role","timer");
    b.innerHTML=`<svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true" style="flex-shrink:0"><circle cx="26" cy="26" r="22" fill="none" stroke="#333338" stroke-width="5"/>
      <circle class="rbArc" cx="26" cy="26" r="22" fill="none" stroke="${AC}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" transform="rotate(-90 26 26)"/></svg>
      <div class="rbTxt"><span class="rbL"></span><span class="rbT"></span></div>
      <button class="rbBtn" data-r="15">+15 s</button><button class="rbBtn skip" data-r="0">Pular</button>`;
    document.body.appendChild(b);document.body.classList.add("resting");
    b.querySelector(".rbL").textContent="Descanso"+(REST.label?" · "+REST.label:"");
    b.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>{
      const s=+x.dataset.r;if(!s)return stopRest();
      REST.end+=s*1000;REST.total+=s;drawRest();
    });
  }
  b.querySelector(".rbT").textContent=Math.floor(left/60)+":"+pad2(left%60);
  b.querySelector(".rbArc").setAttribute("stroke-dashoffset",(C*(1-left/REST.total)).toFixed(1));
  if(left<=0){
    stopRest();
    try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(_){}
    toast("Descanso acabou — próxima série");
  }
}

function lineChart(vals,dates,unit){
  const W=320,H=96,P=8,n=vals.length;
  const lo=Math.min(...vals),hi=Math.max(...vals);let mn=lo,mx=hi;if(mx===mn){mx+=1;mn-=1;}
  const X=i=>n===1?W/2:P+i*(W-2*P)/(n-1),Y=v=>H-P-((v-mn)/(mx-mn))*(H-2*P);
  const pts=vals.map((v,i)=>[X(i).toFixed(1),Y(v).toFixed(1)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  const area=n>1?`<path d="${line} L${pts[n-1][0]} ${H} L${pts[0][0]} ${H} Z" fill="${AC}" fill-opacity=".08"/>`:"";
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===n-1?4.5:3}" fill="${i===n-1?AC:S1}" stroke="${AC}" stroke-width="2"/>`).join("");
  return `<div><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible" role="img" aria-label="Evolução de ${fmtN(round1(vals[0]))} para ${fmtN(round1(vals[n-1]))}${unit?" "+unit:""}">
    <line x1="0" x2="${W}" y1="${P}" y2="${P}" stroke="#2A2A2E" stroke-dasharray="3 5"/><line x1="0" x2="${W}" y1="${H-P}" y2="${H-P}" stroke="#2A2A2E" stroke-dasharray="3 5"/>
    ${area}${n>1?`<path d="${line}" fill="none" stroke="${AC}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}${dots}</svg>
    <div class="chartLbl" style="margin-top:8px"><span>${fmtDate(dates[0])}</span><span>${fmtN(round1(lo))}${lo!==hi?"–"+fmtN(round1(hi)):""}${unit?" "+unit:""}</span><span>${fmtDate(dates[n-1])}</span></div></div>`;
}

// ——— Progresso ———
function progCard(name,prio,hist,e){
  const S=sessionsOf(hist),bw=e&&e.bw,unit=bw?(e.t?"s":"reps"):"kg";
  const vals=S.map(x=>bw?x.r:x.w),best=Math.max(...vals),delta=round1(vals[vals.length-1]-vals[0]),st=stalled(hist,e),last=S[S.length-1];
  return `<section class="card pcard"><div class="pTop"><div class="grow"><div class="exTop"><span class="exn">${esc(name)}</span>
      ${prio?'<span class="pill ac">Prioritário</span>':""}${st?'<span class="pill warn">Estagnou</span>':""}</div>
      <span class="exs">${S.length} sess${S.length===1?"ão":"ões"} · última ${prevLabel(e,last)}</span></div>
    <div style="flex-shrink:0"><div class="big">${fmtN(best)}<small>${unit} máx</small></div>
      ${delta!==0?`<div class="delta" style="color:${delta>0?"var(--good)":"var(--warn)"}">${delta>0?"+":""}${fmtN(delta)} ${unit}</div>`:""}</div></div>
    ${lineChart(vals,S.map(x=>x.date),unit)}</section>`;
}
function progress(){
  TAB="progresso";SCREEN=null;
  const has=k=>(LOG[k]||[]).length>0;
  const segs=WORKOUTS.map(w=>w.id).concat(LEGACY.some(n=>has(slug(n)))?["Antigo"]:[]);
  if(!progSeg||!segs.includes(progSeg))progSeg=(WORKOUTS.find(w=>w.ex.some(e=>has(slug(e.n))))||WORKOUTS[0]).id;
  let list,title="";
  if(progSeg==="Antigo"){list=LEGACY.filter(n=>has(slug(n))).map(n=>progCard(n,false,LOG[slug(n)],null));title="Exercícios do plano antigo";}
  else{const w=WORKOUTS.find(x=>x.id===progSeg);title=w.name;list=w.ex.filter(e=>has(slug(e.n))).map(e=>progCard(e.n,e.prio,LOG[slug(e.n)],e));}
  render(`<main class="scr">${pageHead("Melhor série de cada sessão","Progresso")}
    <div class="segc">${segs.map(s=>`<button class="${s===progSeg?"on":""}" data-seg="${s}" aria-pressed="${s===progSeg}">${s}</button>`).join("")}</div>
    <span class="lbl" style="margin-bottom:-8px">${esc(title)}</span>
    ${list.length?`<div class="col">${list.join("")}</div>`:`<section class="card empty">Nada registrado neste treino ainda.<br>As cargas aparecem aqui depois da primeira sessão.</section>`}
  </main>`);
  app.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{progSeg=b.dataset.seg;progress();});
}

// ——— Corpo: peso diário e InBody ———
function weightChart(){
  const S=weightSorted();
  if(S.length<2)return `<section class="card empty">Registre ao menos 2 dias pra ver a curva.</section>`;
  const W=320,H=110,P=8,d0=dayNum(S[0].date),span=(dayNum(S[S.length-1].date)-d0)||1;
  const avgs=S.map(x=>{const a=avgWindow(x.date,7);return a?a.avg:x.kg;});
  const all=[...S.map(x=>x.kg),...avgs],mn=Math.min(...all),mx=Math.max(...all),rng=(mx-mn)||1;
  const X=iso=>P+((dayNum(iso)-d0)/span)*(W-2*P),Y=v=>H-P-((v-mn)/rng)*(H-2*P);
  const dots=S.map(x=>`<circle cx="${X(x.date).toFixed(1)}" cy="${Y(x.kg).toFixed(1)}" r="2.6" fill="#6B6B73"/>`).join("");
  const line=S.map((x,i)=>(i?"L":"M")+X(x.date).toFixed(1)+" "+Y(avgs[i]).toFixed(1)).join(" ");
  return `<section class="card" style="padding:16px">
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible" role="img" aria-label="Peso ao longo do tempo">${dots}
      <path d="${line}" fill="none" stroke="${AC}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <div class="chartLbl" style="margin-top:8px"><span>${fmtDate(S[0].date)}</span><span>${fmtN(round1(mn))}–${fmtN(round1(mx))} kg</span><span>${fmtDate(S[S.length-1].date)}</span></div>
    <div class="exHint" style="margin-top:8px"><span style="color:#6B6B73">●</span> pesagem do dia · <span style="color:${AC}">━</span> média de 7 dias, o que importa</div></section>`;
}
function weightSection(){
  const t=trend(),v=verdict(t),S=weightSorted().reverse(),today=todayISO(),wT=WEIGHT.find(x=>x.date===today),tc=toneVar(v.tone);
  const hist=S.length?S.slice(0,30).map(x=>`<div class="hrow"><span class="d">${fmtDate(x.date)}</span>
      <span class="v">${fmtN(x.kg)} <span class="muted" style="font-size:13px;font-weight:500">kg</span></span>
      <button class="del${armedW===x.date?" armed":""}" data-wdel="${x.date}" aria-label="Apagar pesagem de ${fmtDate(x.date)}">${armedW===x.date?"Apagar?":ic("trash",16)}</button></div>`).join("")
    :`<div class="empty" style="padding:20px">Nenhuma pesagem ainda.</div>`;
  return `<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px">
      <div class="wrow"><span class="muted" style="font-size:13px;font-weight:500">Média de 7 dias</span>
        ${t.state==="ok"?`<span style="font-size:13px;font-weight:700;color:${tc}">${rateLabel(t.rate)}</span>`:""}</div>
      <div class="wbig">${t.avg!=null?fmtN(round1(t.avg)):"—"}<small>kg</small></div>
      <div class="verd"><div class="vt" style="color:${tc}">${cap(v.short)}</div><div class="vl">${v.long}</div></div></section>
    ${weightChart()}
    <section class="card form"><span class="lbl" style="padding:0">${wT?"Corrigir um dia":"Lançar o peso de hoje"}</span>
      <div class="fgrid"><div class="fld"><label for="wd">Data</label><input type="date" id="wd" value="${today}" max="${today}"></div>
        <div class="fld"><label for="wk">Peso · kg</label><input type="text" inputmode="decimal" id="wk" placeholder="${wT?fmtN(wT.kg):"0,0"}" enterkeyhint="done"></div></div>
      <p class="err" id="wErr" hidden></p>
      <button class="sbtn press" id="wAdd">Salvar pesagem</button>
      <p class="exHint">De manhã, em jejum, depois do banheiro.</p></section>
    <div class="col10"><span class="lbl">Histórico${S.length>30?" · últimas 30":""}</span><section class="card list">${hist}</section></div>`;
}
function bindWeight(){
  const wk=app.querySelector("#wk"),err=app.querySelector("#wErr");
  wk.oninput=()=>{err.hidden=true;};
  wk.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();app.querySelector("#wAdd").click();}};
  app.querySelector("#wAdd").onclick=()=>{
    const c=checkNum(wk.value,"peso");
    if(!c.ok){err.hidden=false;err.textContent=c.msg;return;}
    const raw=app.querySelector("#wd").value,d=raw&&raw<=todayISO()?raw:todayISO();
    const ok=saveWeight(d,c.val);toast(ok?"Pesagem salva":"Não salvou — exporte um backup",!ok);armedW=null;bodyView();
  };
  app.querySelectorAll("[data-wdel]").forEach(b=>b.onclick=()=>{
    const d=b.dataset.wdel;
    if(armedW!==d){armedW=d;bodyView();return;}
    WEIGHT=WEIGHT.filter(x=>x.date!==d);const ok=write(K_WEIGHT,WEIGHT);
    armedW=null;toast(ok?"Pesagem apagada":"Não salvou — exporte um backup",!ok);bodyView();
  });
  if(focusW){focusW=false;wk.focus();}
}
function inbodySection(){
  const sorted=[...BODY].sort(byDate);
  const tiles=BM.map(m=>{
    const withK=sorted.filter(x=>x[m.k]!=null),cur=withK[withK.length-1],pv=withK[withK.length-2],v=cur?cur[m.k]:null;
    let sub=`<span class="s muted">${cur?fmtDate(cur.date):"sem dado"}</span>`;
    if(cur&&pv&&cur[m.k]!==pv[m.k]){
      const d=round1(cur[m.k]-pv[m.k]),g=m.good==="down"?d<0:m.good==="up"?d>0:null;
      sub=`<span class="s" style="color:${g===null?"var(--tx3)":g?"var(--good)":"var(--warn)"}">${d>0?"+":""}${fmtN(d)} ${m.unit}</span>`;
    }
    return `<button class="card tile press${bodyMetric===m.k?" sel":""}" data-m="${m.k}" aria-pressed="${bodyMetric===m.k}"><span class="k">${m.label}</span>
      <span class="v">${v!=null?fmtN(v):"—"}${v!=null?`<small>${m.unit}</small>`:""}</span>${sub}</button>`;
  }).join("");
  const mc=BM.find(m=>m.k===bodyMetric),ser=sorted.filter(x=>x[bodyMetric]!=null);
  const chart=ser.length>=2?`<section class="card pcard"><div class="wrow"><span class="exn">${mc.label}</span><span class="muted" style="font-size:12px;font-weight:600">${ser.length} exames</span></div>
      ${lineChart(ser.map(x=>x[bodyMetric]),ser.map(x=>x.date),mc.unit)}</section>`
    :`<section class="card empty">Registre ao menos 2 exames pra ver a tendência de ${esc(mc.label.toLowerCase())}.</section>`;
  const cell=(v,u)=>v!=null?fmtN(v)+" "+u:"—";
  const hist=sorted.length?[...sorted].reverse().map(x=>`<button class="hrow" data-edit="${x.date}"><span class="d">${fmtDate(x.date)}</span>
      <span class="v" style="font-size:14px">${cell(x.peso,"kg")} · ${cell(x.fat,"%")} · pernas ${cell(x.legs,"kg")}</span><span class="chev">${ic("right",16)}</span></button>`).join("")
    :`<div class="empty" style="padding:20px">Nenhum exame registrado.</div>`;
  return `<div class="grid2">${tiles}</div>${chart}
    <button class="sbtn press" id="addBody">${ic("plus",16,2.6)}Novo exame</button>
    <div class="col10"><span class="lbl">Histórico · toque pra editar</span><section class="card list">${hist}</section></div>`;
}
function bindInbody(){
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{bodyMetric=b.dataset.m;bodyView();});
  app.querySelector("#addBody").onclick=()=>bodySheet(null);
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>bodySheet(BODY.find(x=>x.date===b.dataset.edit)));
}
function bodyView(){
  TAB="corpo";SCREEN=null;
  const peso=bodySeg==="peso";
  render(`<main class="scr">${pageHead(peso?"A média semanal é o juiz do déficit":"Composição corporal","Corpo")}
    <div class="segc"><button class="${peso?"on":""}" data-bs="peso" aria-pressed="${peso}">Peso diário</button><button class="${peso?"":"on"}" data-bs="inbody" aria-pressed="${!peso}">InBody</button></div>
    ${peso?weightSection():inbodySection()}</main>`);
  app.querySelectorAll("[data-bs]").forEach(b=>b.onclick=()=>{bodySeg=b.dataset.bs;armedW=null;bodyView();});
  peso?bindWeight():bindInbody();
}
function bodySheet(orig){
  const v=k=>orig&&orig[k]!=null?fmtN(orig[k]):"";
  const ov=document.createElement("div");ov.className="overlay";
  const F=(id,l,k)=>`<div class="fld"><label for="${id}">${l}</label><input type="text" inputmode="decimal" id="${id}" placeholder="0" value="${v(k)}"></div>`;
  ov.innerHTML=`<div class="sheet" role="dialog" aria-label="${orig?"Editar exame":"Novo exame"}"><div class="grab"></div>
    <div class="sheetT">${orig?"Editar exame":"Novo exame"}</div>
    <p class="sheetD">Lance os números do InBody. Deixe em branco o que não tiver. Pernas e braços: some os dois lados do segmentar.</p>
    <div class="fld" style="margin-bottom:12px"><label for="bd">Data</label><input type="date" id="bd" value="${orig?orig.date:todayISO()}" max="${todayISO()}"></div>
    <div class="fgrid" style="margin-bottom:14px">${F("bp","Peso · kg","peso")}${F("bf","% Gordura","fat")}${F("bl","Massa magra · kg","lean")}${F("bt","Gordura tronco · kg","trunk")}${F("bg","Magra pernas · kg","legs")}${F("ba","Magra braços · kg","arms")}</div>
    <p id="berr" class="err" hidden style="margin-bottom:12px"></p>
    <button class="sbtn" id="bsave">${orig?"Salvar alterações":"Salvar exame"}</button>
    ${orig?`<div style="display:flex;margin-top:10px"><button class="sbtnAlt" id="bdel">${ic("trash",16)}Apagar exame</button></div>`:""}
    <button class="sclose" id="bcls">Cancelar</button></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  const q=s=>ov.querySelector(s);
  q("#bsave").onclick=()=>{
    const berr=q("#berr");berr.hidden=true;
    const raw=q("#bd").value,date=raw&&raw<=todayISO()?raw:todayISO();
    const fields=[["#bp","peso"],["#bf","fat"],["#bl","lean"],["#bt","trunk"],["#bg","legs"],["#ba","arms"]];
    const entry={date,peso:null,fat:null,lean:null,trunk:null,legs:null,arms:null};let filled=0;
    for(const[sel,key]of fields){
      const rv=q(sel).value.trim();if(rv==="")continue;   // em branco é legítimo: nem todo exame traz tudo
      const c=checkNum(rv,key);if(!c.ok){berr.hidden=false;berr.textContent=c.msg;return;}
      entry[key]=c.val;filled++;
    }
    if(!filled){berr.hidden=false;berr.textContent="Preencha ao menos um dos campos.";return;}
    BODY=BODY.filter(x=>x.date!==date&&!(orig&&x.date===orig.date));BODY.push(entry);BODY.sort(byDate);
    const ok=write(K_BODY,BODY);toast(ok?"Exame salvo":"Não salvou — exporte um backup",!ok);ov.remove();bodyView();
  };
  const del=q("#bdel");
  if(del)del.onclick=()=>{
    if(!del.classList.contains("armed")){del.classList.add("armed");del.textContent="Toque de novo pra apagar";return;}
    BODY=BODY.filter(x=>x.date!==orig.date);
    const ok=write(K_BODY,BODY);toast(ok?"Exame apagado":"Não salvou — exporte um backup",!ok);ov.remove();bodyView();
  };
  q("#bcls").onclick=()=>ov.remove();
}

// ——— Dados: backup e restauração ———
function dataSheet(){
  const has=totalRecords()>0||BODY.length>0||DONE.length>0||WEIGHT.length>0;
  const mine=countOf({log:LOG,body:BODY,done:DONE,weight:WEIGHT});
  let mode="merge",pending=null;
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div class="sheet" role="dialog" aria-label="Seus dados"><div class="grab"></div>
    <div class="sheetT">Seus dados</div>
    <p class="sheetD">Tudo fica salvo neste aparelho. Guarde uma cópia pra trocar de celular ou por segurança.</p>
    <div class="metaLine">Aqui hoje: <b>${mine.r} série${mine.r===1?"":"s"}</b> · <b>${mine.p} pesage${mine.p===1?"m":"ns"}</b> · <b>${mine.e} exame${mine.e===1?"":"s"}</b> · <b>${mine.d} treino${mine.d===1?"":"s"} concluído${mine.d===1?"":"s"}</b><br>
      ${META.lastBackup?`Último backup em ${fmtDate(META.lastBackup)} · ${META.since||0} alteraç${(META.since||0)===1?"ão":"ões"} desde então`:"Você ainda não guardou nenhuma cópia."}</div>
    <div class="slbl">Guardar uma cópia</div>
    <button class="sbtn${has?"":" dim"}" id="sh">${ic("cloud",18,2.2)}Salvar backup</button>
    <div style="display:flex;gap:10px;margin-top:10px;margin-bottom:24px">
      <button class="sbtnAlt${has?"":" dim"}" id="dl">Baixar arquivo</button>
      <button class="sbtnAlt${has?"":" dim"}" id="cp">Copiar texto</button></div>
    <div class="slbl">Restaurar</div>
    <div class="seg2"><button data-mode="merge" class="on">Mesclar</button><button data-mode="replace">Substituir</button></div>
    <p class="segNote" id="segNote">Junta o backup com o que já está neste aparelho, sem apagar nada e sem duplicar.</p>
    <label class="filePick" for="fp">${ic("file",18)}Escolher arquivo de backup</label>
    <input type="file" id="fp" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0">
    <textarea class="area" id="pst" placeholder="…ou cole aqui o texto do backup"></textarea>
    <div id="out"></div>
    <button class="sbtn dim" id="rst" style="margin-top:10px">Conferir backup</button>
    ${UNDO?`<div style="display:flex;margin-top:10px"><button class="sbtnAlt" id="undo">Desfazer a última restauração</button></div>`:""}
    <button class="sclose" id="cls">Fechar</button></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  const q=s=>ov.querySelector(s),pst=q("#pst"),rst=q("#rst"),out=q("#out");
  const refresh=()=>{if(SCREEN)workout(SCREEN);else go(TAB);};
  q("#sh").onclick=()=>{if(has)shareBackup().then(()=>{});};
  q("#dl").onclick=()=>{if(has)downloadBackup();};
  q("#cp").onclick=()=>{if(!has)return;navigator.clipboard.writeText(backupJSON())
    .then(()=>{markBackup();toast("Backup copiado");}).catch(()=>toast("Copie manualmente",1));};
  ov.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
    mode=b.dataset.mode;pending=null;out.innerHTML="";
    ov.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x===b));
    q("#segNote").textContent=mode==="merge"
      ?"Junta o backup com o que já está neste aparelho, sem apagar nada e sem duplicar."
      :"Apaga tudo que está neste aparelho e deixa só o conteúdo do backup.";
    rst.textContent="Conferir backup";
  });
  const armed=()=>{rst.classList.toggle("dim",!pst.value.trim());pending=null;out.innerHTML="";rst.textContent="Conferir backup";};
  pst.oninput=armed;
  q("#fp").onchange=ev=>{
    const f=ev.target.files&&ev.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{pst.value=String(rd.result);armed();toast("Arquivo carregado");};
    rd.onerror=()=>toast("Não deu pra ler o arquivo",1);
    rd.readAsText(f);
  };
  rst.onclick=()=>{
    if(!pst.value.trim())return;
    if(!pending){
      const res=parseBundle(pst.value);
      if(typeof res==="string"){out.innerHTML=`<div class="errBox">${esc(res)}</div>`;return;}
      pending=res;
      const inc=countOf(res);
      const after=mode==="merge"
        ?countOf({log:mergeLog(LOG,res.log),body:mergeBody(BODY,res.body),done:mergeDone(DONE,res.done),weight:mergeWeight(WEIGHT,res.weight)})
        :inc;
      out.innerHTML=`<div class="confirmBox">
        <div class="cline"><span>Séries</span><span>${mine.r} → <b>${after.r}</b></span></div>
        <div class="cline"><span>Pesagens</span><span>${mine.p} → <b>${after.p}</b></span></div>
        <div class="cline"><span>Exames</span><span>${mine.e} → <b>${after.e}</b></span></div>
        <div class="cline"><span>Treinos concluídos</span><span>${mine.d} → <b>${after.d}</b></span></div>
        <div class="cnote">${mode==="merge"?"O backup traz "+inc.r+" série"+(inc.r===1?"":"s")+"; as repetidas são descartadas.":"Substituir apaga o que está aqui hoje. Dá pra desfazer logo em seguida."}</div></div>`;
      rst.textContent=mode==="merge"?"Confirmar mesclagem":"Confirmar substituição";
      return;
    }
    UNDO={log:LOG,body:BODY,done:DONE,weight:WEIGHT};   // rede antes de aplicar
    if(mode==="merge"){LOG=mergeLog(LOG,pending.log);BODY=mergeBody(BODY,pending.body);DONE=mergeDone(DONE,pending.done);WEIGHT=mergeWeight(WEIGHT,pending.weight);}
    else{LOG=pending.log;BODY=pending.body;DONE=pending.done;WEIGHT=pending.weight;}
    const ok=write(K_LOG,LOG)&&write(K_BODY,BODY)&&write(K_DONE,DONE)&&write(K_WEIGHT,WEIGHT);
    META.since=0;saveMeta();
    toast(ok?(mode==="merge"?"Backup mesclado":"Backup restaurado"):"Não salvou — armazenamento bloqueado",!ok);
    ov.remove();refresh();
  };
  const un=q("#undo");
  if(un)un.onclick=()=>{
    LOG=UNDO.log;BODY=UNDO.body;DONE=UNDO.done;WEIGHT=UNDO.weight||[];UNDO=null;
    const ok=write(K_LOG,LOG)&&write(K_BODY,BODY)&&write(K_DONE,DONE)&&write(K_WEIGHT,WEIGHT);
    toast(ok?"Restauração desfeita":"Não salvou — exporte um backup",!ok);ov.remove();refresh();
  };
  q("#cls").onclick=()=>ov.remove();
}
