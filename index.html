<style>
:root{
  --bg:#F5F5F1;--ink:#121212;--white:#FFFFFF;--yellow:#FFD400;--yellowDeep:#E6BD00;
  --yellowSoft:#FFF2B8;--faint:#7C7C75;--mute:#C9C9C2;--good:#1f7a3d;--bad:#b4502e;
  --disp:'Anton',Impact,sans-serif;--body:'Inter',system-ui,sans-serif;
  --hard:4px 4px 0 var(--ink);--hardSm:3px 3px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
body{background:var(--bg);font-family:var(--body);color:var(--ink);
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.card{transition:transform .1s ease,box-shadow .1s ease}
.card:active{transform:translate(2px,2px);box-shadow:var(--hardSm)!important}
@keyframes pop{0%{transform:scale(.93);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slideup{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(prefers-reduced-motion:reduce){.card{transition:none}*{animation:none!important}}
.eyebrow{font-family:var(--body);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--yellow)}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:.01em;text-transform:uppercase;line-height:.95}
.board{background:var(--ink);border-radius:18px;padding:22px 20px;display:flex;justify-content:space-between;align-items:flex-end;box-shadow:var(--hard)}
.board .title{font-family:var(--disp);font-size:34px;color:var(--white);line-height:.9;text-transform:uppercase}
.board .title b{color:var(--yellow);font-weight:400}
.count{font-family:var(--disp);font-size:54px;color:var(--yellow);line-height:.8}
.count-l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#BDBDB6;font-weight:700;text-align:right;margin-top:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:100px;border:2px solid var(--ink);font-size:11.5px;font-weight:700}
.chip .d{width:8px;height:8px;border-radius:100px;background:var(--ink)}
.tag-btn{border:2px solid var(--ink);border-radius:100px;padding:6px 14px;font-size:11.5px;font-weight:700;background:var(--white)}
.week{display:flex;gap:6px;margin-top:14px}
.daycol{flex:1;text-align:center}
.daywd{font-size:9px;font-weight:800;color:var(--faint);text-transform:uppercase;margin-bottom:4px;letter-spacing:.04em}
.daybox{height:36px;border-radius:9px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:16px;background:#fff;color:var(--ink)}
.daybox.on{background:var(--yellow)}
.daybox.today{box-shadow:inset 0 0 0 3px var(--yellow)}
.daybox.on.today{box-shadow:inset 0 0 0 3px var(--ink)}
.alert{width:100%;background:var(--yellow);border:2px solid var(--ink);border-radius:14px;padding:12px 15px;margin-top:13px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:var(--hardSm);font-weight:700;font-size:12.5px;text-align:left}
.alert .go{font-family:var(--disp);font-size:14px;text-transform:uppercase}
.wcard{width:100%;background:var(--white);border:2px solid var(--ink);border-radius:16px;padding:15px;margin-bottom:13px;
  box-shadow:var(--hard);display:flex;align-items:center;gap:14px;text-align:left}
.sq{width:46px;height:46px;border-radius:11px;background:var(--ink);color:var(--yellow);
  font-family:var(--disp);font-size:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wname{font-family:var(--disp);font-size:20px;text-transform:uppercase;line-height:.95}
.wfocus{font-size:12.5px;color:#555;margin-top:5px;line-height:1.35}
.meta{display:flex;gap:9px;margin-top:9px;align-items:center;flex-wrap:wrap}
.pill{font-size:10px;font-weight:700;color:var(--ink);background:var(--yellow);border:1.5px solid var(--ink);padding:2px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:.03em}
.when{font-size:11.5px;color:var(--faint);font-weight:500}
.chev{font-family:var(--disp);font-size:26px;color:var(--ink)}
.ctaRow{display:flex;gap:11px;margin-top:6px}
.cta{flex:1;background:var(--yellow);border:2px solid var(--ink);border-radius:16px;padding:15px;box-shadow:var(--hard);
  display:flex;flex-direction:column;align-items:flex-start;min-height:78px;justify-content:center}
.cta.alt{background:var(--ink)}
.cta .t{font-family:var(--disp);font-size:18px;text-transform:uppercase;line-height:.95}
.cta.alt .t{color:#fff}
.cta .s{font-size:11px;color:#3a3a2e;font-weight:600;margin-top:3px;line-height:1.25}
.cta.alt .s{color:#BDBDB6}
.header{background:var(--ink);padding:20px 18px 24px;border-radius:0 0 22px 22px}
.back{background:var(--yellow);color:var(--ink);font-size:12.5px;font-weight:700;padding:8px 15px;border-radius:100px;border:2px solid var(--ink)}
.htitle{font-family:var(--disp);color:var(--white);text-transform:uppercase}
.ex{background:var(--white);border:2px solid var(--ink);border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:var(--hardSm)}
.ex.prio{border-left:8px solid var(--yellow)}
.exHead{width:100%;padding:14px;display:flex;align-items:center;gap:12px;text-align:left}
.exn{font-family:var(--disp);font-size:17px;text-transform:uppercase;line-height:.95}
.exs{font-size:12px;color:#555;margin-top:4px;font-weight:500}
.dot{width:9px;height:9px;border-radius:100px;background:var(--yellow);border:1.5px solid var(--ink);flex-shrink:0}
.stall{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);background:var(--yellow);border:1.5px solid var(--ink);padding:1px 6px;border-radius:6px;display:inline-block}
.lastw{font-family:var(--disp);font-size:18px;color:var(--ink)}
.lastw small{font-size:11px;color:var(--faint);font-weight:400}
.lastd{font-size:10px;color:var(--faint);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fld{flex:1}.fld label{font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px}
.fld input{width:100%;font-family:var(--disp);font-size:22px;color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:7px 12px;outline:none;background:var(--white);text-align:center}
.fld input:focus{box-shadow:var(--hardSm)}
.save{border:2px solid var(--ink);border-radius:10px;font-family:var(--disp);font-size:16px;text-transform:uppercase;padding:9px 16px;white-space:nowrap;height:46px;background:var(--mute)}
.save.on{background:var(--yellow);box-shadow:var(--hardSm)}
.doneBtn{width:100%;margin-top:4px;border:2px solid var(--ink);border-radius:14px;padding:15px;font-family:var(--disp);font-size:18px;
  text-transform:uppercase;box-shadow:var(--hard);background:var(--white)}
.doneBtn.done{background:var(--yellow)}
.best{font-family:var(--disp);font-size:24px;color:var(--ink);line-height:.9}
.best small{font-size:11px;color:var(--faint);font-weight:400}
.delta{font-size:11.5px;font-weight:700;margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:6px}
.tile{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:13px;box-shadow:var(--hardSm);text-align:left}
.tile.sel{background:var(--yellow)}
.tile .tl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.tile.sel .tl{color:#3a3a2e}
.tile .tv{font-family:var(--disp);font-size:28px;margin-top:4px;line-height:.9}
.tile .tv small{font-size:12px;color:var(--faint);font-weight:400}
.tile .td{font-size:11px;font-weight:800;margin-top:4px}
.overlay{position:fixed;inset:0;background:rgba(18,18,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:70;animation:pop .15s ease}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:22px 22px 0 0;border-top:3px solid var(--ink);
  padding:14px 18px calc(26px + env(safe-area-inset-bottom));animation:slideup .25s ease;max-height:90vh;overflow-y:auto}
.grab{width:42px;height:5px;background:var(--ink);border-radius:100px;margin:0 auto 16px}
.lbl{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}
.sbtn{flex:1;background:var(--yellow);border:2px solid var(--ink);border-radius:11px;font-family:var(--disp);font-size:15px;text-transform:uppercase;padding:12px;box-shadow:var(--hardSm)}
.sbtnAlt{flex:1;background:var(--white);border:2px solid var(--ink);border-radius:11px;font-family:var(--disp);font-size:15px;text-transform:uppercase;padding:12px}
.area{width:100%;min-height:64px;font-family:monospace;font-size:16px;color:var(--ink);border:2px solid var(--ink);border-radius:11px;padding:10px;outline:none;resize:vertical;background:var(--white)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.bfld label{font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.bfld input{width:100%;font-family:var(--disp);font-size:20px;color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:8px 11px;outline:none;background:#fff;text-align:center}
.bfld input[type=date]{font-family:var(--body);font-size:16px;font-weight:600}
.toast{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);text-align:center;font-family:var(--disp);font-size:15px;text-transform:uppercase;letter-spacing:.02em;
  padding:12px 22px;border-radius:100px;border:2px solid var(--ink);box-shadow:var(--hard);animation:pop .2s ease;z-index:90;max-width:90%;width:max-content}
.hint{font-size:12px;color:var(--faint);font-weight:500;margin:16px 2px;line-height:1.5}
.warn{width:100%;background:#B4502E;color:#fff;border:2px solid var(--ink);border-radius:16px;padding:15px;box-shadow:var(--hard);margin-bottom:16px;text-align:left}
.warn .wtt{font-family:var(--disp);font-size:19px;text-transform:uppercase;line-height:1}
.warn .ws{font-size:12.5px;font-weight:500;margin-top:7px;line-height:1.45}
.warn .wb{margin-top:12px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:10px;font-family:var(--disp);font-size:14px;text-transform:uppercase;padding:9px 16px;box-shadow:var(--hardSm)}
.exlist-row{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:11px 0;border-bottom:1.5px solid var(--mute);font-size:13px}
.exlist-row:last-child{border-bottom:none}
.rec{display:flex;align-items:stretch;gap:8px;margin-bottom:7px}
.recPick{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--white);border:2px solid var(--ink);border-radius:10px;padding:9px 12px;text-align:left}
.recPick.editing{background:var(--yellowSoft)}
.recD{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.recV{font-family:var(--disp);font-size:16px}
.recDel{width:46px;border:2px solid var(--ink);border-radius:10px;background:var(--white);font-size:15px;flex-shrink:0}
.recDel.armed{background:var(--bad);color:#fff;font-family:var(--disp);font-size:12px;text-transform:uppercase;width:auto;padding:0 12px}
.editBar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--yellowSoft);
  border:2px solid var(--ink);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:12px;font-weight:700}
.editBar button{font-size:11.5px;font-weight:800;text-decoration:underline}
.nudge{width:100%;background:var(--white);border:2px dashed var(--ink);border-radius:14px;padding:12px 15px;margin-top:13px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:12.5px;text-align:left}
.nudge .go{font-family:var(--disp);font-size:14px;text-transform:uppercase;background:var(--yellow);
  border:2px solid var(--ink);border-radius:100px;padding:5px 13px;white-space:nowrap}
.seg{display:flex;gap:0;border:2px solid var(--ink);border-radius:11px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;padding:11px 8px;font-size:12px;font-weight:800;background:var(--white);text-transform:uppercase;letter-spacing:.04em}
.seg button.on{background:var(--ink);color:var(--white)}
.segNote{font-size:11.5px;color:#555;font-weight:500;line-height:1.45;margin-bottom:14px}
.filePick{display:block;width:100%;background:var(--white);border:2px dashed var(--ink);border-radius:11px;
  padding:16px;text-align:center;font-weight:700;font-size:13px;margin-bottom:10px}
.confirmBox{background:var(--yellowSoft);border:2px solid var(--ink);border-radius:11px;padding:14px;margin-top:12px}
.confirmBox .cline{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;padding:3px 0}
.errBox{background:#fdecec;border:2px solid var(--bad);color:#7a2f16;border-radius:11px;padding:12px;
  margin-top:10px;font-size:12.5px;font-weight:600;line-height:1.45}
.fieldErr{font-size:12px;color:var(--bad);font-weight:700;margin-top:9px;line-height:1.4}
.metaLine{font-size:12px;font-weight:600;color:#555;margin-bottom:16px;line-height:1.45}
.wt{background:var(--white);border:2px solid var(--ink);border-radius:16px;padding:14px;margin-top:13px;box-shadow:var(--hard)}
.wt-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.wt-lbl{font-size:10px;font-weight:800;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
.wt-link{font-size:11.5px;font-weight:800;text-decoration:underline;white-space:nowrap;padding:2px 0}
.wt-main{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.wt-num{font-family:var(--disp);font-size:38px;line-height:.85}
.wt-num small{font-size:14px;color:var(--faint);font-weight:400;margin-left:2px}
.wt-side{text-align:right}
.wt-rate{font-family:var(--disp);font-size:15px;text-transform:uppercase;white-space:nowrap}
.wt-verd{font-size:11.5px;font-weight:800;margin-top:3px;text-transform:uppercase;letter-spacing:.03em}
.wt-entry{display:flex;gap:9px;margin-top:13px}
.wt-entry input{flex:1;min-width:0;font-family:var(--disp);font-size:20px;border:2px solid var(--ink);border-radius:10px;
  padding:8px 10px;outline:none;background:var(--white);text-align:center}
.wt-entry input:focus{box-shadow:var(--hardSm)}
.wt-save{border:2px solid var(--ink);border-radius:10px;font-family:var(--disp);font-size:15px;text-transform:uppercase;
  padding:9px 16px;white-space:nowrap;background:var(--mute)}
.wt-save.on{background:var(--yellow);box-shadow:var(--hardSm)}
.wt-ok{font-size:11.5px;font-weight:700;color:var(--good);margin-top:9px}
.verdBox{border-left:5px solid var(--faint);background:var(--bg);border-radius:9px;padding:11px 13px;margin-top:13px}
.verdT{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.verdL{font-size:12.5px;color:#3f3f39;font-weight:500;line-height:1.5;margin-top:5px}
.pill.dark{background:var(--ink);color:#fff}
.hero{width:100%;display:block;text-align:left;background:var(--yellow);border:2px solid var(--ink);border-radius:18px;padding:16px;margin-top:14px;box-shadow:var(--hard)}
.heroTop{display:flex;justify-content:space-between;align-items:center}
.heroEy{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.heroProg{font-family:var(--disp);font-size:18px}
.heroRow{display:flex;align-items:center;gap:13px;margin-top:11px}
.heroSub{font-size:12px;color:#3a3a2e;font-weight:600;margin-top:5px}
.heroGo{display:block;margin-top:14px;background:var(--ink);color:var(--yellow);border-radius:11px;padding:12px;text-align:center;font-family:var(--disp);font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.whead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px}
.ldate{display:flex;align-items:center;gap:8px;background:#2a2a2a;border-radius:100px;padding:4px 4px 4px 13px;color:#fff;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.ldate input{font-family:var(--body);font-size:16px;font-weight:700;border:none;border-radius:100px;padding:5px 11px;background:#fff;color:var(--ink);outline:none}
.wprog{font-size:12px;color:#BDBDB6;font-weight:700;white-space:nowrap}
.wprog b{font-family:var(--disp);font-size:24px;color:var(--yellow);font-weight:400;margin-right:1px}
.pbar{height:6px;background:#2f2f2f;border-radius:100px;margin-top:11px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--yellow);transition:width .3s ease}
.pastNote{margin:14px 14px 0;background:var(--yellowSoft);border:2px solid var(--ink);border-radius:11px;padding:10px 12px;font-size:12.5px;font-weight:700}
.ex.complete .exHead{background:#F3F8F1}
.lastd.ok{color:var(--good)}
.upTag{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--good);border:1.5px solid var(--ink);padding:1px 6px;border-radius:6px;display:inline-block}
.sug{font-size:12.5px;font-weight:700;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;margin-bottom:12px;background:var(--bg);line-height:1.4}
.sug.up{background:var(--yellow)}
.recV small{font-family:var(--body);font-size:11px;font-weight:700;color:var(--faint);margin:0 3px}
.lastw small{margin-left:2px}
.prevRow{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:7px 0;border-bottom:1.5px solid var(--mute);font-weight:600;color:#555}
.prevRow span:last-child{text-align:right;color:var(--ink);font-weight:700}
body.resting #app{padding-bottom:96px}
.restBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:452px;
  background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--yellow);overflow:hidden;z-index:80;animation:slideup .25s ease}
.rbFill{position:absolute;top:0;bottom:0;left:0;background:rgba(255,212,0,.2);transition:width .25s linear}
.rbIn{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px}
.rbL{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--yellow)}
.rbT{font-family:var(--disp);font-size:32px;line-height:.95;margin-top:2px}
.rbBtns{display:flex;gap:8px}
.rbBtns button{border:2px solid #fff;border-radius:10px;padding:9px 12px;font-family:var(--disp);font-size:14px;text-transform:uppercase;color:#fff}
.rbBtns button.skip{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.sbtnAlt.armed{background:var(--bad);color:#fff}

<body>
<div id="app"></div>
<script>
const C_INK="#121212",C_YEL="#FFD400";
const WORKOUTS=[
 {id:"A",name:"Superior · Largura + Costas",focus:"Ombro lateral e dorsal pra abrir o shape; remada e face pull pra postura",ex:[

function topReps(e){const m=String(e.r).match(/(\d+)\D+(\d+)/);if(m)return +m[2];const n=String(e.r).match(/\d+/);return n?+n[0]:null;}
// Cada dia vira uma sessão; a "melhor série" é a carga mais alta e, nela, o maior número de reps.
function sessionsOf(hist){
  const m=new Map();
  (hist||[]).forEach(x=>{if(!m.has(x.date))m.set(x.date,[]);m.get(x.date).push(x);});
  return [...m.entries()].sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0).map(([date,sets])=>{
    const w=Math.max(...sets.map(x=>x.w)),r=Math.max(...sets.filter(x=>x.w===w).map(x=>x.r));
    return{date,sets,w,r};
  });
}

function suggestion(e,hist,date){
  if(e.bw)return null;
  const prev=sessionsOf(hist).filter(x=>x.date<date).pop(),top=topReps(e);
  if(!prev||!top)return null;
  const work=prev.sets.filter(x=>x.w===prev.w);
  if(work.length>=e.s&&work.every(x=>x.r>=top)){
    const nw=round1(prev.w+(e.inc||2.5));
    return{up:true,w:nw,msg:`Bateu ${top} reps em todas as séries em ${fmtDate(prev.date)}. Hoje: ${fmtN(nw)} kg.`};
  }
  return{up:false,w:prev.w,msg:`Mantenha ${fmtN(prev.w)} kg e busque ${top} reps em todas as ${e.s} séries.`};
}

  });

}

// ——— Peso diário e média móvel de 7 dias ———
// A pesagem de um dia é ruído (água, sal, intestino). A média de 7 dias é o sinal,
// e é ela que o plano alimentar usa como juiz do déficit.
const dayNum=iso=>Math.round(new Date(iso+"T00:00:00").getTime()/86400000);
const shiftISO=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return isoOf(d);};
const round1=n=>Math.round(n*10)/10;
function weightSorted(){return [...WEIGHT].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}
function avgWindow(endISO,days){
  const end=dayNum(endISO),start=end-(days-1);
  const vals=WEIGHT.filter(x=>{const d=dayNum(x.date);return d>=start&&d<=end;}).map(x=>x.kg);
  if(!vals.length)return null;
  return{avg:vals.reduce((a,b)=>a+b,0)/vals.length,n:vals.length};
}
function saveWeight(date,kg){
  WEIGHT=WEIGHT.filter(x=>x.date!==date);
  WEIGHT.push({date,kg});
  WEIGHT.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return write(K_WEIGHT,WEIGHT);
}
// Compara a média dos últimos 7 dias com a dos 7 anteriores: a diferença é kg/semana.
function trend(){
  const today=todayISO(),cur=avgWindow(today,7);
  if(!cur)return{state:"empty"};
  const prev=avgWindow(shiftISO(today,-7),7);
  if(!prev)return{state:"young",avg:cur.avg,n:cur.n};
  let weeks=0;
  for(let k=0;k<6;k++){
    const a=avgWindow(shiftISO(today,-7*k),7),b=avgWindow(shiftISO(today,-7*(k+1)),7);
    if(!a||!b)break;
    if(a.avg-b.avg>-0.25)weeks++;else break;
  }
  return{state:"ok",avg:cur.avg,n:cur.n,rate:cur.avg-prev.avg,weeks};
}
// Traduz a taxa na regra que já está escrita no plano alimentar do Gabriel:
// alvo 0,3–0,5 kg/semana; parado 2–3 semanas → cortar 150 kcal; rápido demais → somar 150.
function verdict(t){
  if(t.state==="empty")return{tone:"n",short:"sem registro",long:"Pese-se de manhã, em jejum, depois do banheiro. Em alguns dias a média aparece aqui."};
  if(t.state==="young")return{tone:"n",short:t.n+" dia"+(t.n>1?"s":"")+" registrado"+(t.n>1?"s":""),
    long:"A tendência só fica confiável com duas semanas de registro. Continue lançando todo dia."};
  const r=t.rate;
  if(r<=-0.7)return{tone:"b",short:"caindo rápido demais",
    long:"Mais de 0,7 kg por semana: nesse ritmo o corpo começa a cobrar em músculo. Some uns 150 kcal por dia."};
  if(r<=-0.25)return{tone:"g",short:"no alvo",
    long:"Perdendo entre 0,25 e 0,7 kg por semana. Está funcionando — não mexa em nada."};
  if(r>=0.15)return{tone:"b",short:"subindo",
    long:"A média subiu. Antes de mudar qualquer número, pese por 7 dias o óleo, a aveia e o whey — é por aí que as calorias voltam sem você perceber."};
  if(t.weeks>=2)return{tone:"b",short:"parado há "+t.weeks+" semanas",
    long:"Antes de cortar calorias, revise a adesão: pese óleo, aveia e whey por 7 dias seguidos. Se continuar parado com tudo pesado, aí sim reduza uns 150 kcal."};
  return{tone:"n",short:"praticamente parado",
    long:"Uma semana parada é normal: água, sal e intestino escondem a perda de gordura. Só vale agir depois de 2–3 semanas assim."};
}

function setLabel(e,x){
  return e.bw?`${x.r}<small>${e.t?" s":" reps"}</small>`:`${fmtN(x.w)}<small>kg ×</small>${x.r}`;
}
function exRow(e,i){
  const k=slug(e.n),hist=LOG[k]||[],open=openEx===i;
  const day=hist.map((x,idx)=>({x,idx})).filter(o=>o.x.date===logDate),complete=day.length>=e.s;
  const past=sessionsOf(hist).filter(x=>x.date<logDate),prevS=past[past.length-1];

  const right=day.length
    ?`<div class="lastw">${day.length}<small>/${e.s} séries</small></div><div class="lastd${complete?" ok":""}">${complete?"✓ completo":"em andamento"}</div>`
    :prevS?`<div class="lastw">${setLabel(e,prevS)}</div><div class="lastd">últ. ${fmtDate(prevS.date)}</div>`
    :`<span style="font-size:12px;color:var(--faint);font-weight:600">NOVO</span>`;

      <button class="recDel${armedDel===o.idx?" armed":""}" data-del="${o.idx}" aria-label="apagar série ${n+1}">${armedDel===o.idx?"apagar?":"🗑"}</button>
    </div>`).join("");
    const prevRows=past.slice(-3).reverse().map(x=>`<div class="prevRow"><span>${fmtDate(x.date)}</span>
      <span>${x.sets.map(y=>e.bw?y.r+(e.t?"s":""):fmtN(y.w)+"×"+y.r).join(" · ")}</span></div>`).join("");
    body=`<div style="padding:0 14px 16px;animation:pop .18s ease">
      <div style="height:2px;background:var(--ink);margin-bottom:14px"></div>
      ${sug&&!ed?`<div class="sug${sug.up?" up":""}">${sug.up?"▲ ":""}${esc(sug.msg)}</div>`:""}

        <div class="fld"><label>${e.t?"Segundos":"Reps"}</label><input type="text" inputmode="numeric" id="r${i}" placeholder="${e.t?"45":(topReps(e)||"")}" value="${ed?ed.r:""}"></div>
        <button class="save" id="sv${i}">${ed?"Atualizar":complete?"+ Extra":"+ Série "+(day.length+1)}</button>
      </div>
      <p id="err${i}" class="fieldErr" style="display:none"></p>
      ${prevRows?`<div class="lbl" style="margin-top:18px;margin-bottom:4px">Sessões anteriores</div>${prevRows}`:""}
      <p style="font-size:11.5px;color:var(--faint);font-weight:500;line-height:1.45;margin-top:10px">Toque numa série pra corrigir. Pra mexer num treino antigo, troque a data lá em cima.</p>
    </div>`;
  }
  return `<div class="ex${e.prio?" prio":""}${complete?" complete":""}" data-i="${i}">
    <button class="exHead" data-toggle="${i}">

        <div class="exs">${e.s} × ${esc(e.r)}${e.note?` · <span style="color:var(--faint)">${esc(e.note)}</span>`:""}</div>

function bindEx(w){
  const rerender=()=>workout(w.id,true);
  app.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.toggle;openEx=openEx===i?null:i;editIdx=null;armedDel=null;focusEx=openEx!==null;rerender();
  });
  if(scrollEx&&openEx!==null){const el=app.querySelector(`[data-i="${openEx}"]`);if(el)el.scrollIntoView({block:"start",behavior:"smooth"});}
  scrollEx=false;
  if(openEx===null){focusEx=false;return;}

  const i=openEx,e=w.ex[i],k=slug(e.n);
  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    const idx=+b.dataset.pick;editIdx=editIdx===idx?null:idx;armedDel=null;focusEx=editIdx!==null;rerender();
  });
  const cancel=app.querySelector("[data-cancel]");
  if(cancel)cancel.onclick=()=>{editIdx=null;armedDel=null;rerender();};

  // Apagar pede dois toques: o primeiro só arma o botão, o segundo confirma.
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const idx=+b.dataset.del;
    if(armedDel!==idx){armedDel=idx;rerender();return;}
    const arr=(LOG[k]||[]).slice();arr.splice(idx,1);
    if(arr.length)LOG[k]=arr;else delete LOG[k];
    const ok=write(K_LOG,LOG);
    armedDel=null;editIdx=null;
    toast(ok?"série apagada":"NÃO salvou — exporte",!ok);
    rerender();
  });

  const wi=app.querySelector("#w"+i),ri=app.querySelector("#r"+i),sv=app.querySelector("#sv"+i),err=app.querySelector("#err"+i);
  const showErr=m=>{err.style.display="block";err.textContent=m;};
  const upd=()=>{err.style.display="none";sv.classList.toggle("on",(!wi||wi.value.trim()!=="")&&ri.value.trim()!=="");};
  if(wi)wi.oninput=upd;ri.oninput=upd;upd();
  ri.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();sv.click();}};

  sv.onclick=()=>{
    let wv=0;
    if(wi){const cw=checkNum(wi.value,"carga");if(!cw.ok){showErr(cw.msg);return;}wv=cw.val;}
    const cr=checkNum(ri.value,e.t?"seg":"reps");if(!cr.ok){showErr(cr.msg);return;}
    const arr=(LOG[k]||[]).slice(),wasEdit=editIdx!=null&&arr[editIdx];
    if(wasEdit)arr[editIdx]={date:arr[editIdx].date,w:wv,r:cr.val};
    else arr.push({date:logDate,w:wv,r:cr.val});
    arr.sort(byDate);
    LOG[k]=arr;
    const ok=write(K_LOG,LOG);
    editIdx=null;armedDel=null;
    if(!ok){toast("NÃO salvou — exporte",1);rerender();return;}
    if(wasEdit){toast("série corrigida");rerender();return;}
    const n=setsOn(arr,logDate).length;
    let msg="série "+n+" registrada";
    if(n>=e.s){
      // Exercício completo: abre o próximo que ainda falta.
      const pend=j=>setsOn(LOG[slug(w.ex[j].n)],logDate).length<w.ex[j].s;
      let nx=w.ex.findIndex((_,j)=>j>i&&pend(j));if(nx<0)nx=w.ex.findIndex((_,j)=>pend(j));
      openEx=nx>=0?nx:null;scrollEx=nx>=0;
      msg=nx>=0?"exercício completo":"todos feitos — conclua o treino";
    }
    // O timer nasce antes do aviso, pro aviso já subir acima da barra.
    if(logDate===todayISO()&&openEx!==null)startRest(restFor(e));
    toast(msg);
    rerender();
  };
  if(focusEx){(wi&&!wi.value?wi:ri).focus({preventScroll:true});}
  focusEx=false;
}

// ——— Timer de descanso ———
// Conta pelo relógio, não por ticks: se o celular bloquear a tela, o tempo continua certo.
function startRest(sec){
  REST={end:Date.now()+sec*1000,total:sec};drawRest();
  if(!restTick)restTick=setInterval(drawRest,250);
}
function stopRest(){
  REST=null;if(restTick){clearInterval(restTick);restTick=null;}
  const b=document.getElementById("restBar");if(b)b.remove();
  document.body.classList.remove("resting");
}
function drawRest(){
  if(!REST)return stopRest();
  const left=Math.max(0,Math.ceil((REST.end-Date.now())/1000));
  let b=document.getElementById("restBar");
  if(!b){
    b=document.createElement("div");b.id="restBar";b.className="restBar";
    b.innerHTML=`<div class="rbFill"></div><div class="rbIn"><div><div class="rbL">Descanso</div><div class="rbT"></div></div>
      <div class="rbBtns"><button data-r="15">+15 s</button><button data-r="0" class="skip">Pular</button></div></div>`;
    document.body.appendChild(b);document.body.classList.add("resting");
    b.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>{
      const s=+x.dataset.r;if(!s)return stopRest();
      REST.end+=s*1000;REST.total+=s;drawRest();
    });
  }
  b.querySelector(".rbT").textContent=Math.floor(left/60)+":"+pad2(left%60);
  b.querySelector(".rbFill").style.width=(100*(1-left/REST.total)).toFixed(1)+"%";
  if(left<=0){
    stopRest();
    try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(_){}
    toast("descanso acabou — próxima série");
  }
}

function sparkVals(vals){
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1,W=300,H=54,n=vals.length;
  const pts=vals.map((v,i)=>{const x=n===1?W/2:(i/(n-1))*(W-10)+5;const y=H-7-((v-mn)/rng)*(H-16);return[x,y];});
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${C_YEL}" stroke="${C_INK}" stroke-width="2"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible"><path d="${line}" fill="none" stroke="${C_INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}
function progCard(name,prio,hist,e){
  const S=sessionsOf(hist),bw=e&&e.bw,unit=bw?(e.t?"s":"reps"):"kg";
  const vals=S.map(x=>bw?x.r:x.w),best=Math.max(...vals),delta=round1(vals[vals.length-1]-vals[0]),st=stalled(hist,e);
  return `<div class="ex${prio?" prio":""}" style="padding:15px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${prio?'<span class="dot"></span>':""}<span class="exn">${esc(name)}</span>${st?'<span class="stall">estagnou</span>':""}</div>
      <div style="text-align:right;flex-shrink:0">
        <div class="best">${fmtN(best)}<small>${unit} máx</small></div>
        ${delta!==0?`<div class="delta" style="color:${delta>0?"var(--good)":"var(--bad)"}">${delta>0?"+":""}${fmtN(delta)} ${unit}</div>`:""}
      </div></div>
    <div style="margin-top:11px">${sparkVals(vals)}</div>
    <div style="font-size:10.5px;color:var(--faint);margin-top:7px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">${S.length} sess${S.length===1?"ão":"ões"} · última ${fmtDate(S[S.length-1].date)}</div></div>`;
}
function progress(){

// Pontos cinza = pesagem do dia (ruído). Linha preta = média de 7 dias (sinal).
// Eixo X espaçado por data de verdade, pra que um intervalo sem registro apareça como intervalo.
function weightChart(){
  const S=weightSorted();
  if(S.length<2)return `<div class="ex" style="padding:18px;text-align:center;color:#555;font-size:13px;font-weight:500">Registre ao menos 2 dias pra ver a curva.</div>`;
  const W=300,H=96,P=8;
  const d0=dayNum(S[0].date),span=(dayNum(S[S.length-1].date)-d0)||1;
  const avgs=S.map(x=>{const a=avgWindow(x.date,7);return a?a.avg:x.kg;});
  const all=[...S.map(x=>x.kg),...avgs];
  const mn=Math.min(...all),mx=Math.max(...all),rng=(mx-mn)||1;
  const X=iso=>P+((dayNum(iso)-d0)/span)*(W-2*P);
  const Y=v=>H-P-((v-mn)/rng)*(H-2*P);
  const dots=S.map(x=>`<circle cx="${X(x.date).toFixed(1)}" cy="${Y(x.kg).toFixed(1)}" r="2.6" fill="#B4B4AD"/>`).join("");
  const line=S.map((x,i)=>(i?"L":"M")+X(x.date).toFixed(1)+" "+Y(avgs[i]).toFixed(1)).join(" ");
  return `<div class="ex" style="padding:15px">
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible" role="img" aria-label="peso ao longo do tempo">
      ${dots}<path d="${line}" fill="none" stroke="${C_INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-weight:700;margin-top:7px">
      <span>${fmtDate(S[0].date)}</span><span>${fmtN(round1(mn))}–${fmtN(round1(mx))} kg</span><span>${fmtDate(S[S.length-1].date)}</span></div>
    <div style="font-size:11px;color:var(--faint);font-weight:600;margin-top:9px;line-height:1.5">
      <span style="color:#B4B4AD">●</span> pesagem do dia &nbsp;·&nbsp; <b style="color:var(--ink)">—</b> média de 7 dias, o que importa</div>
  </div>`;
}

    const c=checkNum(app.querySelector("#wk").value,"peso");
    if(!c.ok){err.style.display="block";err.textContent=c.msg;return;}
    const raw=app.querySelector("#wd").value,d=raw&&raw<=todayISO()?raw:todayISO();
    const ok=saveWeight(d,c.val);
    toast(ok?"pesagem salva":"NÃO salvou — exporte",!ok);
    armedW=null;weightView();
  };
  app.querySelectorAll("[data-wdel]").forEach(b=>b.onclick=()=>{
    const d=b.dataset.wdel;
    if(armedW!==d){armedW=d;weightView();return;}
    WEIGHT=WEIGHT.filter(x=>x.date!==d);
    const ok=write(K_WEIGHT,WEIGHT);
    armedW=null;toast(ok?"pesagem apagada":"NÃO salvou — exporte",!ok);weightView();
  });
}

function bodyView(){
  const sorted=[...BODY].sort(byDate);
  const latest=sorted[sorted.length-1];
  const tiles=BM.map(m=>{
    // Compara com o exame anterior que tem esse campo, não só com o penúltimo.
    const withK=sorted.filter(x=>x[m.k]!=null),cur=withK[withK.length-1],pv=withK[withK.length-2];
    const v=cur?cur[m.k]:null;
    let dHtml="";
    if(cur&&pv&&cur[m.k]!==pv[m.k]){const d=round1(cur[m.k]-pv[m.k]);
      const goodDir=m.good==="down"?d<0:m.good==="up"?d>0:null;
      const col=goodDir===null?"var(--faint)":goodDir?"var(--good)":"var(--bad)";
      dHtml=`<div class="td" style="color:${col}">${d>0?"+":""}${fmtN(d)}${m.unit}</div>`;}
    return `<button class="tile${bodyMetric===m.k?" sel":""}" data-m="${m.k}">
      <div class="tl">${m.label}</div>
      <div class="tv">${v!=null?fmtN(v):"—"}<small>${v!=null?m.unit:""}</small></div>${dHtml}</button>`;
  }).join("");
  const mc=BM.find(m=>m.k===bodyMetric);
  const series=sorted.filter(x=>x[bodyMetric]!=null).map(x=>x[bodyMetric]);
  const chart=series.length>=2?`<div class="ex" style="padding:15px;margin-top:4px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="exn" style="font-size:15px">${mc.label}</span>
        <span style="font-size:10.5px;color:var(--faint);font-weight:700;text-transform:uppercase">${series.length} exames</span></div>
      <div style="margin-top:11px">${sparkVals(series)}</div></div>`
    :`<div class="ex" style="padding:18px;margin-top:4px;text-align:center;color:#555;font-size:13px;font-weight:500">Registre ao menos 2 exames pra ver a tendência de ${esc(mc.label.toLowerCase())}.</div>`;
  const cell=(v,u)=>v!=null?fmtN(v)+u:"—";
  const hist=sorted.length?[...sorted].reverse().map(x=>`<button class="exlist-row" data-edit="${x.date}">
      <span style="font-weight:800">${fmtDate(x.date)}</span>
      <span style="color:#555">${cell(x.peso,"kg")} · ${cell(x.fat,"%")} · pernas ${cell(x.legs,"kg")}</span>
      <span class="chev" style="font-size:18px">›</span></button>`).join("")
    :`<p style="font-size:13px;color:#555;font-weight:500;padding:12px 0">Nenhum exame registrado.</p>`;
  app.innerHTML=`<div style="animation:slideup .3s ease">
    <div class="header" style="padding-bottom:22px"><button class="back" id="back">‹ Treinos</button>
      <div class="htitle" style="font-size:28px;margin-top:15px">Composição</div>
      <p style="font-size:12.5px;color:#BDBDB6;margin-top:7px;font-weight:500">Seu placar de verdade. Tronco e pernas são o foco.</p>
    </div>
    <div style="padding:16px 14px 44px">
      <div class="tiles">${tiles}</div>
      ${chart}
      <button class="card sbtn" id="addBody" style="width:100%;margin-top:14px">+ Novo exame</button>
      <div class="lbl" style="margin-top:24px">Histórico · toque pra editar</div>
      <div class="ex" style="padding:4px 15px">${hist}</div>
    </div></div>`;
  app.querySelector("#back").onclick=home;
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{bodyMetric=b.dataset.m;bodyView();});
  app.querySelector("#addBody").onclick=()=>bodySheet(null);
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>bodySheet(BODY.find(x=>x.date===b.dataset.edit)));
}
function bodySheet(orig){
  const v=k=>orig&&orig[k]!=null?fmtN(orig[k]):"";
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div class="sheet">
    <div class="grab"></div>
    <div class="disp" style="font-size:26px;margin-bottom:5px">${orig?"Editar exame":"Novo exame"}</div>
    <p style="font-size:12.5px;color:#555;margin-bottom:18px;line-height:1.45;font-weight:500">Lance os números do seu InBody. Pode deixar em branco o que não tiver. Pernas e braços: some os dois lados do segmentar.</p>
    <div class="bfld" style="margin-bottom:14px"><label>Data</label><input type="date" id="bd" value="${orig?orig.date:todayISO()}" max="${todayISO()}"></div>
    <div class="bgrid">
      <div class="bfld"><label>Peso · kg</label><input type="text" inputmode="decimal" id="bp" placeholder="0" value="${v("peso")}"></div>
      <div class="bfld"><label>% Gordura</label><input type="text" inputmode="decimal" id="bf" placeholder="0" value="${v("fat")}"></div>
      <div class="bfld"><label>Massa magra · kg</label><input type="text" inputmode="decimal" id="bl" placeholder="0" value="${v("lean")}"></div>
      <div class="bfld"><label>Gordura tronco · kg</label><input type="text" inputmode="decimal" id="bt" placeholder="0" value="${v("trunk")}"></div>
      <div class="bfld"><label>Magra pernas · kg</label><input type="text" inputmode="decimal" id="bg" placeholder="0" value="${v("legs")}"></div>
      <div class="bfld"><label>Magra braços · kg</label><input type="text" inputmode="decimal" id="ba" placeholder="0" value="${v("arms")}"></div>
    </div>
    <p id="berr" class="fieldErr" style="display:none;margin-top:0;margin-bottom:12px"></p>
    <button class="card sbtn" id="bsave" style="width:100%">${orig?"Salvar alterações":"Salvar exame"}</button>
    ${orig?`<button class="card sbtnAlt" id="bdel" style="width:100%;margin-top:10px">Apagar exame</button>`:""}
    <button id="bcls" style="width:100%;margin-top:12px;font-size:13px;color:var(--faint);padding:8px;font-weight:600">Cancelar</button>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  const q=s=>ov.querySelector(s);
  q("#bsave").onclick=()=>{
    const berr=q("#berr");berr.style.display="none";
    const raw=q("#bd").value,date=raw&&raw<=todayISO()?raw:todayISO();
    const fields=[["#bp","peso"],["#bf","fat"],["#bl","lean"],["#bt","trunk"],["#bg","legs"],["#ba","arms"]];
    const entry={date,peso:null,fat:null,lean:null,trunk:null,legs:null,arms:null};
    let filled=0;
    for(const[sel,key]of fields){
      const rv=q(sel).value.trim();
      if(rv==="")continue;                 // campo em branco é legítimo: nem todo exame traz tudo
      const c=checkNum(rv,key);
      if(!c.ok){berr.style.display="block";berr.textContent=c.msg;return;}
      entry[key]=c.val;filled++;
    }
    if(!filled){berr.style.display="block";berr.textContent="Preencha ao menos um dos campos.";return;}
    BODY=BODY.filter(x=>x.date!==date&&!(orig&&x.date===orig.date));BODY.push(entry);BODY.sort(byDate);
    const ok=write(K_BODY,BODY);toast(ok?"exame salvo":"NÃO salvou — exporte já",!ok);ov.remove();bodyView();
  };
  const del=q("#bdel");
  if(del)del.onclick=()=>{
    if(!del.classList.contains("armed")){del.classList.add("armed");del.textContent="Toque de novo pra apagar";return;}
    BODY=BODY.filter(x=>x.date!==orig.date);
    const ok=write(K_BODY,BODY);toast(ok?"exame apagado":"NÃO salvou — exporte",!ok);ov.remove();bodyView();
  };
  q("#bcls").onclick=()=>ov.remove();
}

// ——— Backup: validação, mesclagem e exportação ———

const ISO_RE=/^\d{4}-\d{2}-\d{2}$/;
// Devolve {log,body,done} normalizado, ou uma string com o motivo da recusa.
// O restaurar antigo aceitava qualquer objeto e o jogava direto dentro de LOG,
// corrompendo a base. Aqui nada entra sem conferir a forma.
function parseBundle(text){
  let o;
  try{o=JSON.parse(String(text).trim());}catch(e){return "Isso não é um backup válido — o texto não está no formato JSON.";}
  if(!o||typeof o!=="object"||Array.isArray(o))return "Isso não é um backup válido.";
  let log=o.log,body=o.body,done=o.done,weight=o.weight;
  if(log===undefined&&body===undefined&&done===undefined&&weight===undefined){log=o;body=[];done=[];} // backup antigo, só o log
  log=log||{};body=body||[];done=done||[];weight=weight||[];   // backups v2 não têm peso diário
  if(typeof log!=="object"||Array.isArray(log))return "Backup inválido: a parte de treinos está corrompida.";
  if(!Array.isArray(body)||!Array.isArray(done))return "Backup inválido: a parte de exames ou de dias concluídos está corrompida.";
  if(!Array.isArray(weight))return "Backup inválido: a parte de pesagens está corrompida.";
  for(const k of Object.keys(log)){
    if(!Array.isArray(log[k]))return `Backup inválido: os registros de "${k}" não formam uma lista.`;
    for(const e of log[k]){
      if(!e||typeof e!=="object"||!ISO_RE.test(e.date||"")||typeof e.w!=="number"||typeof e.r!=="number")
        return `Backup inválido: há um registro malformado em "${k}".`;
    }
  }
  for(const e of body)if(!e||typeof e!=="object"||!ISO_RE.test(e.date||""))return "Backup inválido: há um exame sem data válida.";
  for(const e of done)if(!e||typeof e!=="object"||!ISO_RE.test(e.date||"")||typeof e.id!=="string")return "Backup inválido: há um dia concluído malformado.";
  for(const e of weight)if(!e||typeof e!=="object"||!ISO_RE.test(e.date||"")||typeof e.kg!=="number")return "Backup inválido: há uma pesagem malformada.";
  return {log,body,done,weight};
}
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
// Séries idênticas no mesmo dia são legítimas (3 × 70 kg × 10). Conta quantas vezes
// cada uma aparece de cada lado e fica com o maior número — nunca colapsa séries.
function mergeLog(a,b){
  const out={};
  Object.keys(a).forEach(k=>out[k]=a[k].slice());
  Object.keys(b).forEach(k=>{
    const cur=out[k]||[],have=new Map();
    cur.forEach(x=>{const s=x.date+"|"+x.w+"|"+x.r;have.set(s,(have.get(s)||0)+1);});
    b[k].forEach(x=>{const s=x.date+"|"+x.w+"|"+x.r,n=have.get(s)||0;if(n>0)have.set(s,n-1);else cur.push({...x});});
    out[k]=cur.sort(byDate);
  });
  return out;
}
function mergeBody(a,b){const m={};a.forEach(x=>m[x.date]=x);b.forEach(x=>m[x.date]=x);return Object.values(m).sort(byDate);}
function mergeDone(a,b){const m={};[...a,...b].forEach(x=>m[x.date+"|"+x.id]=x);return Object.values(m).sort(byDate);}
function mergeWeight(a,b){const m={};a.forEach(x=>m[x.date]=x);b.forEach(x=>m[x.date]=x);return Object.values(m).sort(byDate);}
const countOf=b=>({r:Object.values(b.log).reduce((s,a)=>s+a.length,0),e:b.body.length,d:b.done.length,p:(b.weight||[]).length});

function backupJSON(){return JSON.stringify({v:3,log:LOG,body:BODY,done:DONE,weight:WEIGHT},null,2);}
function downloadBackup(){
  try{
    const b=new Blob([backupJSON()],{type:"application/json"});
    const u=URL.createObjectURL(b),a=document.createElement("a");
    a.href=u;a.download="treino-backup-"+todayISO()+".json";a.click();
    setTimeout(()=>URL.revokeObjectURL(u),1000);
    markBackup();toast("arquivo gerado");return true;
  }catch(e){toast("não deu — use copiar",1);return false;}
}
// No iPhone, o download em app da tela inicial é justamente onde o iOS falha.
// A folha de compartilhamento nativa manda pro Arquivos, iCloud, Notas ou WhatsApp.
async function shareBackup(){
  const json=backupJSON();
  try{
    const file=new File([json],"treino-backup-"+todayISO()+".json",{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Backup do Treino"});
      markBackup();toast("backup salvo");return;
    }
  }catch(e){
    if(e&&e.name==="AbortError")return;   // usuário fechou a folha: não é erro
  }
  downloadBackup();
}

function dataSheet(){
  const has=totalRecords()>0||BODY.length>0||DONE.length>0||WEIGHT.length>0;
  const mine=countOf({log:LOG,body:BODY,done:DONE,weight:WEIGHT});
  let mode="merge",pending=null;
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div class="sheet">
    <div class="grab"></div>
    <div class="disp" style="font-size:26px;margin-bottom:5px">Seus dados</div>
    <p style="font-size:12.5px;color:#555;margin-bottom:14px;line-height:1.45;font-weight:500">
      Tudo fica salvo neste aparelho. Guarde uma cópia pra trocar de celular ou por segurança.</p>
    <div class="metaLine">Hoje aqui: <b>${mine.r} registro${mine.r===1?"":"s"}</b> · <b>${mine.p} pesage${mine.p===1?"m":"ns"}</b> · <b>${mine.e} exame${mine.e===1?"":"s"}</b> · <b>${mine.d} dia${mine.d===1?"":"s"} concluído${mine.d===1?"":"s"}</b><br>
      ${META.lastBackup?`Último backup em ${fmtDate(META.lastBackup)} · ${META.since||0} alteraç${(META.since||0)===1?"ão":"ões"} desde então`:"Você ainda não guardou nenhuma cópia."}</div>
    <div class="lbl">Guardar uma cópia</div>
    <button class="card sbtn" id="sh" style="width:100%;opacity:${has?1:.4}">Salvar backup</button>
    <div style="display:flex;gap:10px;margin-top:10px;margin-bottom:22px">
      <button class="card sbtnAlt" id="dl" style="opacity:${has?1:.4}">Baixar arquivo</button>
      <button class="card sbtnAlt" id="cp" style="opacity:${has?1:.4}">Copiar texto</button></div>
    <div class="lbl">Restaurar</div>
    <div class="seg" id="seg">
      <button data-mode="merge" class="on">Mesclar</button>
      <button data-mode="replace">Substituir</button></div>
    <p class="segNote" id="segNote">Junta o backup com o que já está neste aparelho, sem apagar nada e sem duplicar.</p>
    <label class="filePick" for="fp">📄 Escolher arquivo de backup</label>
    <input type="file" id="fp" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0">
    <textarea class="area" id="pst" placeholder="…ou cole aqui o texto do backup"></textarea>
    <div id="out"></div>
    <button class="card sbtn" id="rst" style="width:100%;margin-top:10px;opacity:.4">Conferir backup</button>
    ${UNDO?`<button class="card sbtnAlt" id="undo" style="width:100%;margin-top:10px">Desfazer a última restauração</button>`:""}
    <button id="cls" style="width:100%;margin-top:14px;font-size:13px;color:var(--faint);padding:8px;font-weight:600">Fechar</button>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  const q=s=>ov.querySelector(s);
  const pst=q("#pst"),rst=q("#rst"),out=q("#out");

  q("#sh").onclick=()=>{if(has)shareBackup().then(()=>{});};
  q("#dl").onclick=()=>{if(has)downloadBackup();};
  q("#cp").onclick=()=>{if(!has)return;navigator.clipboard.writeText(backupJSON())
    .then(()=>{markBackup();toast("copiado");}).catch(()=>toast("copie manualmente",1));};

  ov.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
    mode=b.dataset.mode;pending=null;out.innerHTML="";
    ov.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x===b));
    q("#segNote").textContent=mode==="merge"
      ? "Junta o backup com o que já está neste aparelho, sem apagar nada e sem duplicar."
      : "Apaga tudo que está neste aparelho e deixa só o conteúdo do backup.";
    rst.textContent="Conferir backup";
  });

  const armed=()=>{rst.style.opacity=pst.value.trim()?1:.4;pending=null;out.innerHTML="";rst.textContent="Conferir backup";};
  pst.oninput=armed;
  q("#fp").onchange=ev=>{
    const f=ev.target.files&&ev.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{pst.value=String(rd.result);armed();toast("arquivo carregado");};
    rd.onerror=()=>toast("não deu pra ler o arquivo",1);
    rd.readAsText(f);
  };

  rst.onclick=()=>{
    if(!pst.value.trim())return;
    if(!pending){
      const res=parseBundle(pst.value);
      if(typeof res==="string"){out.innerHTML=`<div class="errBox">${esc(res)}</div>`;return;}
      pending=res;
      const inc=countOf(res);
      const after=mode==="merge"
        ? countOf({log:mergeLog(LOG,res.log),body:mergeBody(BODY,res.body),done:mergeDone(DONE,res.done),weight:mergeWeight(WEIGHT,res.weight)})
        : inc;
      out.innerHTML=`<div class="confirmBox">
        <div class="cline"><span>Registros de treino</span><span>${mine.r} → <b>${after.r}</b></span></div>
        <div class="cline"><span>Pesagens</span><span>${mine.p} → <b>${after.p}</b></span></div>
        <div class="cline"><span>Exames</span><span>${mine.e} → <b>${after.e}</b></span></div>
        <div class="cline"><span>Dias concluídos</span><span>${mine.d} → <b>${after.d}</b></span></div>
        <div style="font-size:11.5px;font-weight:600;color:#3a3a2e;margin-top:9px;line-height:1.45">
          ${mode==="merge"?"O backup traz "+inc.r+" registro"+(inc.r===1?"":"s")+"; as repetições são descartadas.":"Substituir vai apagar o que está aqui hoje. Dá pra desfazer logo em seguida."}</div></div>`;
      rst.textContent=mode==="merge"?"Confirmar mesclagem":"Confirmar substituição";
      return;
    }
    UNDO={log:LOG,body:BODY,done:DONE,weight:WEIGHT};   // rede antes de aplicar
    if(mode==="merge"){LOG=mergeLog(LOG,pending.log);BODY=mergeBody(BODY,pending.body);DONE=mergeDone(DONE,pending.done);WEIGHT=mergeWeight(WEIGHT,pending.weight);}
    else{LOG=pending.log;BODY=pending.body;DONE=pending.done;WEIGHT=pending.weight;}
    const ok=write(K_LOG,LOG)&&write(K_BODY,BODY)&&write(K_DONE,DONE)&&write(K_WEIGHT,WEIGHT);
    META.since=0;saveMeta();
    toast(ok?(mode==="merge"?"mesclado":"restaurado"):"NÃO salvou — armazenamento bloqueado",!ok);
    ov.remove();home();
  };

  const un=q("#undo");
  if(un)un.onclick=()=>{
    LOG=UNDO.log;BODY=UNDO.body;DONE=UNDO.done;WEIGHT=UNDO.weight||[];UNDO=null;
    const ok=write(K_LOG,LOG)&&write(K_BODY,BODY)&&write(K_DONE,DONE)&&write(K_WEIGHT,WEIGHT);
    toast(ok?"desfeito":"NÃO salvou — exporte",!ok);ov.remove();home();
  };
  q("#cls").onclick=()=>ov.remove();
}

home();
